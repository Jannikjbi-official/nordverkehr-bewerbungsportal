# Optional: komplettes Selbsthosting (statt Vercel + Neon).
#   docker compose up -d --build
#   docker compose run --rm setup      # Schema (Migrationen) + Basisdaten (einmalig)
services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: nordverkehr
      POSTGRES_PASSWORD: nordverkehr
      POSTGRES_DB: nordverkehr
    volumes:
      - pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nordverkehr -d nordverkehr"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  web:
    build: { context: ., target: web }
    env_file: .env
    environment:
      DATABASE_URL: postgresql://nordverkehr:nordverkehr@db:5432/nordverkehr
    ports: ["3000:3000"]
    depends_on:
      db: { condition: service_healthy }
    restart: unless-stopped

  worker:
    build: { context: ., target: worker }
    env_file: .env
    environment:
      DATABASE_URL: postgresql://nordverkehr:nordverkehr@db:5432/nordverkehr
    depends_on:
      db: { condition: service_healthy }
    restart: unless-stopped

  setup:
    build: { context: ., target: worker }
    env_file: .env
    environment:
      DATABASE_URL: postgresql://nordverkehr:nordverkehr@db:5432/nordverkehr
      SEED_DEMO: "false"
    command: ["sh", "-c", "npx tsx scripts/db-migrate.mts && npx prisma db seed"]
    depends_on:
      db: { condition: service_healthy }
    profiles: ["setup"]

volumes:
  pg-data:
