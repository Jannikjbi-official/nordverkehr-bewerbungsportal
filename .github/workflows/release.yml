# Release nur bei großen Änderungen – nie automatisch pro Tag:
#  - Tag pushen:            git tag v1.1 && git push origin v1.1
#  - oder in GitHub:        Actions → Release → „Run workflow“ → Version eintragen
# Ergebnis: GitHub-Release mit allen Changelog-Einträgen seit dem letzten Release.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version (z. B. v1.1)"
        required: true

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Version bestimmen
        id: tag
        run: |
          TAG="${{ github.event.inputs.version || github.ref_name }}"
          [[ "$TAG" =~ ^v[0-9]+(\.[0-9]+){0,2}$ ]] || { echo "Ungültige Version: $TAG (erwartet z. B. v1.1)"; exit 1; }
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Release-Notizen aus dem Changelog
        run: |
          TAG="${{ steps.tag.outputs.tag }}"
          # Vorheriges Release (Tag) – Notizen enthalten alle Versionen danach
          PREV=$(git tag --list 'v*' --sort=-v:refname | grep -vx "$TAG" | head -n1 || true)
          echo "Vorheriges Release: ${PREV:-keins}"
          npx --yes tsx scripts/release-notes.mts "$TAG" "$PREV" > release-notes.md
          cat release-notes.md

      - name: GitHub-Release anlegen
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ steps.tag.outputs.tag }}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --notes-file release-notes.md
          else
            gh release create "$TAG" --target "${{ github.sha }}" --title "Nordverkehr Bewerbungsportal ${TAG}" --notes-file release-notes.md
          fi
