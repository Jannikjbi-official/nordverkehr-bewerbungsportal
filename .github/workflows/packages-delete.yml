# Container-Packages (ghcr.io) löschen – nur von Hand: Actions → „Packages löschen“.
# Die Images wurden früher vom Release-Workflow gebaut; heute gibt es keine Packages mehr.
name: Packages löschen

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: "Zum Bestätigen LÖSCHEN eintippen"
        required: true

permissions:
  packages: write

jobs:
  delete:
    runs-on: ubuntu-latest
    steps:
      - name: Images web und worker löschen
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CONFIRM: ${{ github.event.inputs.confirm }}
        run: |
          [ "$CONFIRM" = "LÖSCHEN" ] || { echo "Nicht bestätigt – nichts gelöscht."; exit 1; }
          OWNER="${GITHUB_REPOSITORY_OWNER}"
          REPO="${GITHUB_REPOSITORY#*/}"
          # Benutzer- oder Organisationskonto?
          TYPE=$(gh api "users/$OWNER" --jq .type)
          BASE=$([ "$TYPE" = "Organization" ] && echo "orgs/$OWNER" || echo "users/$OWNER")
          for target in web worker; do
            NAME="${REPO,,}-${target}"
            if gh api "$BASE/packages/container/$NAME" >/dev/null 2>&1; then
              gh api -X DELETE "$BASE/packages/container/$NAME" && echo "Gelöscht: $NAME" || echo "Konnte $NAME nicht löschen (Rechte?)"
            else
              echo "Nicht vorhanden oder kein Zugriff: $NAME"
            fi
          done
